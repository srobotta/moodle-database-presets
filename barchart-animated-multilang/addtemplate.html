<div class="defaulttemplate favorite-instrument">
  <table class="table bg-light" style="max-width: 500px;">
    <tbody>
      <tr class="lastrow">
        <td class="template-field cell c0">
          <span class="multilang" lang="en">Please choose your favorite instrument</span>
          <span class="multilang" lang="de">Wähle hier dein Lieblingsinstrument aus</span>
          <span class="multilang" lang="fr">Choisis ton instrument préféré</span>:
        </td>
        <td class="template-token cell c1 lastcol">
          <select name="[[instrument#id]]">
            <option class="translate-instrument" value="violin">violin</option>
            <option class="translate-instrument" value="guitar">guitar</option>
            <option class="translate-instrument" value="drums">drums</option>
            <option class="translate-instrument" value="saxophone">saxophone</option>
            <option class="translate-instrument" value="piano">piano</option>
            <option class="translate-instrument" value="radio">radio</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>
